<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Clock</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0; /* Warna teks putih keabu-abuan senada dengan header */
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Rata kiri agar nempel rapi dengan titik hijau */
            height: 100%;
            overflow: hidden;
        }
        #realtime-clock {
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="realtime-clock">Memuat waktu...</div>

    <script>
        function updateClock() {
            const now = new Date();
            
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = [
                'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];
            
            const dayName = days[now.getDay()];
            const date = now.getDate();
            const monthName = months[now.getMonth()];
            const year = now.getFullYear();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const displayString = `${dayName}, ${date} ${monthName} ${year} — ${hours}:${minutes}:${seconds}`;
            
            document.getElementById('realtime-clock').innerText = displayString;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
